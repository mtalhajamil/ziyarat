<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A space for exploring places of ziyarat.">
    <title>Ziyarat</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="Ziyarat home">Ziyarat<span aria-hidden="true">.</span></a>
      <span class="header-note">A place to begin</span>
    </header>

    <main>
      <section class="destinations" aria-labelledby="page-title">
        <p class="eyebrow">A journey of reflection</p>
        <h1 id="page-title">Places of ziyarat</h1>
        <p class="intro-text">A space for exploring places of ziyarat, thoughtfully and at your own pace.</p>

        <div class="destination-grid">
          <article class="destination-card">
            <div class="card-art card-art-makkah" aria-hidden="true"><span></span></div>
            <div class="card-content">
              <p class="card-label">Ziyarat</p>
              <h2>Makkah</h2>
              <p class="card-status">Coming soon</p>
            </div>
          </article>
          <article class="destination-card">
            <div class="card-art card-art-madinah" aria-hidden="true"><span></span></div>
            <div class="card-content">
              <p class="card-label">Ziyarat</p>
              <h2>Madinah</h2>
              <p class="card-status">Coming soon</p>
            </div>
          </article>
          <article class="destination-card">
            <div class="card-art card-art-badr" aria-hidden="true"><span></span></div>
            <div class="card-content">
              <p class="card-label">Ziyarat</p>
              <h2>Badr</h2>
              <p class="card-status">Coming soon</p>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>Ziyarat</span>
      <span>Made for meaningful journeys.</span>
    </footer>
  </body>
</html>
