<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Page templates</title></head>
  <body>
    <template id="destination-template">
      <article class="destination-card">
        <img class="card-image" data-field="image" alt="">
        <div class="card-content">
          <h2 data-field="name"></h2>
          <p class="card-status" data-field="status"></p>
        </div>
      </article>
    </template>
    <template id="place-template">
      <div class="place-preview" role="region" aria-label="Place details">
        <div class="place-heading">
          <h1 class="place-title" data-field="name" aria-live="polite" tabindex="-1"></h1>
        </div>
        <div class="place-slider">
          <button class="slider-arrow" type="button" aria-label="Previous place" data-action="previous">&larr;</button>
          <div class="place-image-wrap">
            <img class="place-image" data-field="image" alt="">
            <div class="image-placeholder" data-field="image-placeholder" hidden>Image coming soon</div>
          </div>
          <button class="slider-arrow" type="button" aria-label="Next place" data-action="next">&rarr;</button>
        </div>
        <div class="place-actions">
          <a class="map-link" data-field="map">View on Google Maps <span aria-hidden="true">&rarr;</span></a>
          <a class="video-link" data-field="video" target="_blank" rel="noopener noreferrer" hidden>Watch place video</a>
        </div>
        <div class="place-details">
          <p class="image-credit" data-field="image-credit" hidden>Photo: <a data-field="image-source"></a> · <a data-field="image-license"></a></p>
          <div class="description-grid" data-field="descriptions">
            <div class="language-toggle" role="group" aria-label="Description language">
              <button type="button" data-field="language-en" aria-label="Show English description" aria-pressed="true" aria-controls="english-description">EN</button>
              <button type="button" data-field="language-ur" aria-label="Show Urdu description" aria-pressed="false" aria-controls="urdu-description">UR</button>
            </div>
            <section id="english-description" data-field="english-panel" lang="en" aria-label="English description">
              <p id="english-description-text" data-field="english"></p>
              <button class="description-more" type="button" data-field="english-more" aria-label="Show more description" aria-expanded="false" aria-controls="english-description-text" hidden>Show more</button>
            </section>
            <section id="urdu-description" data-field="urdu-panel" lang="ur" dir="rtl" aria-label="Urdu description" hidden>
              <p id="urdu-description-text" data-field="urdu" lang="ur" dir="rtl"></p>
              <button class="description-more" type="button" data-field="urdu-more" lang="ur" dir="rtl" aria-label="مزید تفصیل دکھائیں" aria-expanded="false" aria-controls="urdu-description-text" hidden>مزید دکھائیں</button>
            </section>
          </div>
          <p class="description-empty" data-field="description-empty" hidden>Description coming soon</p>
        </div>
      </div>
    </template>
  </body>
</html>
